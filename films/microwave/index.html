<!doctype html>
<!--
  SHEET — microwave
  Logline: رجل ترك المدرسة في الثانية عشرة لاحظ أن الشوكولاتة ذابت في جيبه، فاخترع الميكروويف.
  Style:   قصة تاريخية قصيرة بأسلوب الريلز — بطاقة بولارويد على ورق مربعات، كلمات تظهر واحدة واحدة، عناوين ملونة عريضة.
  Frame:   9:16, 1080x1920
  Runtime: 30s
  Sakuga:  S5 — حبوب الذرة تنفجر فشاراً (the verb: انفجرت)

  Shots (sum = 30.0s)
    S1  0.0 – 3.6   3.6  hook      المختبر ليلاً، العنوان المتوهج
    S2  3.6 – 8.0   4.4  who       بولارويد بيرسي سبنسر على ورق مربعات كهرماني
    S3  8.0 – 12.0  4.0  place     1945، المغنيترون وأجهزة الرادار
    S4  12.0 – 16.4 4.4  approach  الشوكولاتة تذوب (3 رسومات)
    S5  16.4 – 20.4 4.0  SAKUGA    الفشار ينفجر (8 رسومات)
    S6  20.4 – 24.4 4.0  scale     أول ميكروويف: 1.8 متر، 340 كغ
    S7  24.4 – 27.6 3.2  payoff    العنوان الملون المتراكم
    S8  27.6 – 30.0 2.4  button    ومكافأته؟ دولاران فقط

  Color script (closed)
    ink      #0e0d0c   amber    #c9822b   amberDeep #6b3a12
    paper    #efe9dc   line     #f6f1e7   glow      #ffd25a
    red      #e0373f   wood     #3a2a1f   steel     #59646b
    sepia    #b4946c   choco    #4a2a1a   blue      #4fb3ff
    green    #2fe36a
-->
<html lang="ar" dir="rtl">

    <style>

        font-style: normal;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        background: #0e0d0c;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0e0d0c;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .stage {
        position: absolute;
        inset: 0;
        transform-origin: 50% 45%;
      }
      .stage > svg {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      #s1 { z-index: 18; }
      #s2 { z-index: 17; }
      #s3 { z-index: 16; }
      #s4 { z-index: 15; }
      #s5 { z-index: 14; }
      #s6 { z-index: 13; }
      #s7 { z-index: 12; }
      #s8 { z-index: 11; }
      #dip {
        background: #0e0d0c;
        z-index: 40;
        opacity: 0;
      }

      /* grid paper */
      .grid-amber {
        background-color: #c9822b;
        background-image:
          linear-gradient(rgba(14, 13, 12, 0.13) 2px, transparent 2px),
          linear-gradient(90deg, rgba(14, 13, 12, 0.13) 2px, transparent 2px);
        background-size: 48px 48px;
      }
      .grid-paper {
        background-color: #efe9dc;
        background-image:
          linear-gradient(rgba(89, 100, 107, 0.22) 2px, transparent 2px),
          linear-gradient(90deg, rgba(89, 100, 107, 0.22) 2px, transparent 2px);
        background-size: 54px 54px;
      }

      /* words */
      .w {
        position: absolute;
        opacity: 0;
        transform: translateY(24px);
        white-space: nowrap;
        direction: rtl;
      }
      .serif {
        font-family: "Amiri", serif;
        font-weight: 700;
        color: #f6f1e7;
        font-size: 66px;
        text-shadow: 0 0 18px rgba(14, 13, 12, 0.85), 0 4px 10px rgba(14, 13, 12, 0.7);
      }
      .bold {
        font-family: "Lalezar", sans-serif;
        font-weight: 400;
        line-height: 1;
      }
      .center {
        left: 0;
        right: 0;
        text-align: center;
      }

      /* polaroid */
      .polaroid {
        position: absolute;
        background: #efe9dc;
        padding: 26px 26px 0 26px;
        box-shadow: 0 30px 60px rgba(14, 13, 12, 0.45), 0 6px 14px rgba(14, 13, 12, 0.35);
      }
      .polaroid .cap {
        font-family: "Lalezar", sans-serif;
        color: #0e0d0c;
        text-align: center;
        font-size: 64px;
        line-height: 1;
        padding: 26px 0 30px 0;
      }

      /* drawing swaps */
      .dr {
        opacity: 0;
      }
      .dr.hero {
        opacity: 1;
      }

      /* stitched card */
      .card {
        position: absolute;
        left: 110px;
        top: 360px;
        width: 860px;
        height: 1200px;
        border-radius: 90px;
        background: #0e0d0c;
        box-shadow: 0 0 0 10px #0e0d0c, 0 40px 80px rgba(14, 13, 12, 0.9);
      }
      .card::after {
        content: "";
        position: absolute;
        inset: 22px;
        border-radius: 72px;
        border: 4px dashed rgba(246, 241, 231, 0.55);
      }
    </style>

      <!-- S6 scale: the first microwave -->
      <div id="s6" class="clip grid-paper" data-start="20.15" data-duration="4.28" data-track-index="2">
        <div class="stage" id="s6-stage">
          <svg viewBox="0 0 1080 1920">

            <!-- radarange cabinet -->

              <rect x="40" y="680" width="300" height="200" fill="#0e0d0c" />
              <g fill="#ffd25a">
                <circle cx="100" cy="780" r="22" />
                <circle cx="190" cy="780" r="22" />
                <rect x="250" y="760" width="60" height="40" />
              </g>
              <rect x="40" y="920" width="300" height="300" fill="#efe9dc" stroke="#0e0d0c" stroke-width="8" />
              <rect x="70" y="950" width="240" height="240" fill="#0e0d0c" opacity="0.85" />
              <rect x="320" y="1040" width="16" height="70" fill="#0e0d0c" />
              <g stroke="#0e0d0c" stroke-width="6">
                <path d="M40,1280 L340,1280 M40,1330 L340,1330 M40,1380 L340,1380 M40,1430 L340,1430 M40,1480 L340,1480 M40,1530 L340,1530" />

            <!-- person for scale -->
            <g fill="#0e0d0c" transform="translate(190 0)">
              <circle cx="0" cy="760" r="56" />
              <path d="M-70,830 L70,830 L84,1200 L50,1200 L44,1660 L8,1660 L0,1260 L-8,1660 L-44,1660 L-50,1200 L-84,1200 Z" />

            <!-- measuring line -->
            <g stroke="#e0373f" stroke-width="6" fill="#e0373f">

          <!-- red banner -->
          <div id="banner" style="position: absolute; left: -40px; right: -40px; top: 300px; height: 150px; background: #e0373f; transform: rotate(-3deg); box-shadow: 0 14px 30px rgba(14, 13, 12, 0.3)"></div>
          <div class="w serif center" data-at="20.7" style="top: 300px; font-size: 80px; text-shadow: none; color: #f6f1e7; transform: translateY(24px) rotate(-3deg)">أول ميكروويف في التاريخ</div>

      <!-- S7 payoff: stacked color title -->
      <div id="s7" class="clip" data-start="24.15" data-duration="3.48" data-track-index="1">

          <div class="w bold center" data-at="25.35" style="top: 880px; font-size: 150px; color: #e0373f; text-shadow: 0 0 30px #e0373f">جهازاً</div>
          <div class="w bold center" data-at="25.75" style="top: 1040px; font-size: 150px; color: #ffd25a; text-shadow: 0 0 30px #ffd25a">في كلّ</div>
          <div class="w bold center" data-at="26.15" style="top: 1200px; font-size: 150px; color: #2fe36a; text-shadow: 0 0 30px #2fe36a">مطبخ</div>
          <div class="w bold center" data-at="26.6" style="top: 1360px; font-size: 80px; color: #f6f1e7">تقريباً</div>

      <!-- S8 button: two dollars -->
      <div id="s8" class="clip" data-start="27.35" data-duration="2.65" data-track-index="2">
        <div class="stage" id="s8-stage" style="background: radial-gradient(circle at 50% 50%, #1c1712 0%, #0e0d0c 75%)">
          <div class="w serif" data-at="27.75" style="top: 520px; left: 560px; font-size: 84px">ومكافأته</div>
          <div class="w serif" data-at="28.0" style="top: 640px; left: 300px; font-size: 84px">من</div>
          <div class="w serif" data-at="28.2" style="top: 760px; left: 420px; font-size: 84px">الشركة؟</div>
          <div class="w bold center" data-at="28.75" style="top: 1000px; font-size: 200px; color: #ffd25a; text-shadow: 0 0 50px #ffd25a">دولاران</div>
          <div class="w bold center" data-at="29.05" style="top: 1210px; font-size: 130px; color: #f6f1e7">فقط.</div>
        </div>
      </div>

      <div id="dip" class="clip" data-start="0" data-duration="30" data-track-index="3"></div>
    </div>
    <script>
      // Popcorn drawings: positions written out, no randomness.
      const NS = "http://www.w3.org/2000/svg";
      function kernel(x, y, r, sq) {
        const sy = sq ? 0.7 : 1;
        return `<ellipse cx="${x}" cy="${y}" rx="${r * (sq ? 1.2 : 1)}" ry="${r * 0.8 * sy}" fill="#ffd25a" stroke="#0e0d0c" stroke-width="4"/>`;
      }
      function puff(x, y, s) {
        return `<g transform="translate(${x} ${y}) scale(${s})">
          <circle cx="-14" cy="4" r="20" fill="#f6f1e7" stroke="#0e0d0c" stroke-width="5"/>
          <circle cx="14" cy="6" r="18" fill="#f6f1e7" stroke="#0e0d0c" stroke-width="5"/>
          <circle cx="0" cy="-14" r="20" fill="#f6f1e7" stroke="#0e0d0c" stroke-width="5"/>
          <circle cx="2" cy="10" r="9" fill="#ffd25a"/>
        </g>`;
      }
      function smear(x1, y1, x2, y2, w) {
        const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
        const nx = (-dy / len) * w, ny = (dx / len) * w;
        return `<path d="M${x1 + nx},${y1 + ny} L${x2},${y2} L${x1 - nx},${y1 - ny} Z" fill="#f6f1e7" stroke="#0e0d0c" stroke-width="4"/>`;
      }
      const bed = [[400,1400],[450,1392],[500,1404],[550,1396],[600,1404],[650,1394],[690,1402],[430,1420],[520,1424],[620,1420],[470,1380],[580,1380]];
      const P1 = [[470,1290,1],[600,1260,1.1],[540,1330,0.9]];
      const P2 = [[360,1080,1.3],[720,1020,1.4],[540,960,1.2],[460,1220,1.1],[640,1180,1.2],[260,1250,1]];
      const BURST = [[180,820,1.6],[900,760,1.7],[540,700,1.5],[340,960,1.5],[760,920,1.6],[120,1150,1.4],[960,1100,1.5],[460,1120,1.4],[640,1060,1.5],[300,1300,1.2],[800,1280,1.3]];
      const PILE = [[360,1370,1.4],[440,1340,1.5],[540,1320,1.6],[640,1340,1.5],[720,1370,1.4],[480,1290,1.3],[600,1290,1.3],[540,1250,1.2],[180,1560,1.3],[920,1580,1.3],[820,1500,1.1]];
      const fill = (id, html) => { document.getElementById(id).innerHTML = html; };
      fill("pc-rest", bed.map(([x, y]) => kernel(x, y, 18, false)).join(""));
      fill("pc-antic", bed.map(([x, y]) => kernel(x, y + 6, 18, true)).join(""));
      fill("pc-pop1", bed.slice(3).map(([x, y]) => kernel(x, y, 18, false)).join("") + P1.map(([x, y, s]) => puff(x, y, s)).join(""));
      fill("pc-smear1", P2.map(([x, y, s]) => smear(540, 1380, x, y, 22 * s)).join("") + P2.map(([x, y, s]) => puff(x, y, s * 0.8)).join(""));
      fill("pc-pop2", P2.map(([x, y, s]) => puff(x, y, s)).join("") + bed.slice(7).map(([x, y]) => kernel(x, y, 18, false)).join(""));
      fill("pc-smear2", BURST.map(([x, y, s]) => smear(540, 1360, x, y, 26 * s)).join("") + BURST.map(([x, y, s]) => puff(x, y, s * 0.8)).join(""));
      fill("pc-burst", BURST.map(([x, y, s]) => puff(x, y, s)).join("") + P1.map(([x, y, s]) => puff(x, y + 40, s * 1.3)).join(""));
      fill("pc-settle", PILE.map(([x, y, s]) => puff(x, y, s)).join(""));

      const tl = gsap.timeline({ paused: true });
      const F = 1 / 24;

      // cuts: color dip to ink, straddling each cut
      const cuts = [3.6, 8.0, 12.0, 16.4, 20.4, 24.4, 27.6];
      tl.set("#dip", { opacity: 0 }, 0);
      cuts.forEach((c) => {
        tl.to("#dip", { opacity: 1, duration: 0.22, ease: "power2.in" }, c - 0.22);
        tl.to("#dip", { opacity: 0, duration: 0.3, ease: "power2.out" }, c + 0.05);
      });

      // words: rise 24px and fade in
      document.querySelectorAll("[data-at]").forEach((el) => {
        const at = parseFloat(el.dataset.at);
        tl.to(el, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, at);
      });

      // S1 hook: slow push, lamp flicker on ones
      tl.fromTo("#s1-stage", { scale: 1 }, { scale: 1.06, duration: 3.6, ease: "power1.inOut", immediateRender: false }, 0);
      tl.set("#s1-bulb", { opacity: 0.6 }, 2.4);
      tl.set("#s1-bulb", { opacity: 1 }, 2.4 + F);

      // S2 who: card drops onto the paper, then push in
      tl.fromTo("#pol", { y: -900, rotation: 8 }, { y: 0, rotation: -4, duration: 0.5, ease: "power3.out", immediateRender: false }, 3.6);
      tl.fromTo("#s2-stage", { scale: 1 }, { scale: 1.06, duration: 3.8, ease: "power1.inOut", immediateRender: false }, 4.1);

      // S3 place: core pulses, waves travel up (finite repeat)
      tl.to("#s3-glow", { scale: 1.15, transformOrigin: "50% 50%", duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 7 }, 8.0);
      tl.fromTo("#s3-waves", { y: 60, opacity: 0.2 }, { y: -120, opacity: 1, duration: 0.8, ease: "none", repeat: 4, immediateRender: false }, 8.0);
      tl.fromTo("#s3-stage", { scale: 1 }, { scale: 1.06, duration: 4.0, ease: "power1.inOut", immediateRender: false }, 8.0);

      // S4 approach: three drawings, stepped
      tl.set("#ch-a", { opacity: 0 }, 13.5);
      tl.set("#ch-b", { opacity: 1 }, 13.5);
      tl.set("#ch-b", { opacity: 0 }, 14.25);
      tl.set("#ch-c", { opacity: 1 }, 14.25);

      // S5 SAKUGA: locked camera, drawings on ones/twos
      const pc = ["#pc-rest", "#pc-antic", "#pc-pop1", "#pc-smear1", "#pc-pop2", "#pc-smear2", "#pc-burst", "#pc-settle"];
      // frames each drawing holds: antic 4, pop1 2, smear 1, pop2 2, smear 1, burst 2, then settle holds
      const holds = [4, 2, 1, 2, 1, 2];
      let t = 17.75;
      for (let i = 1; i < pc.length; i++) {
        tl.set(pc[i - 1], { opacity: 0 }, t);
        tl.set(pc[i], { opacity: 1 }, t);
        if (i <= holds.length) t += holds[i - 1] * F;
      }

      // S6 scale: banner slides in from the side, push in on the hold
      tl.fromTo("#banner", { x: -1200 }, { x: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, 20.45);
      tl.fromTo("#s6-stage", { scale: 1 }, { scale: 1.06, duration: 4.0, ease: "power1.inOut", immediateRender: false }, 20.4);

      // S7 payoff: slow push on the card
      tl.fromTo("#s7-stage", { scale: 1 }, { scale: 1.05, duration: 3.2, ease: "power1.inOut", immediateRender: false }, 24.4);

      // S8 button: last 8 frames to ink
      tl.to("#s8", { opacity: 0, duration: 8 * F, ease: "power1.in" }, 30 - 8 * F);

      window.__timelines = window.__timelines || {};
      window.__timelines["microwave"] = tl;
    </script>

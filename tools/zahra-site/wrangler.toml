name = "zahra-shein"
main = "src/index.js"
compatibility_date = "2025-06-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "zahra"
# Filled in by the deploy steps (wrangler d1 create zahra).
database_id = "00000000-0000-0000-0000-000000000000"

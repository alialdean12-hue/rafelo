plugins { id "com.android.application" }

android {
    namespace "com.rafelo.picks"
    compileSdk 35
    defaultConfig {
        applicationId "com.rafelo.picks"
        minSdk 24
        targetSdk 35
        versionCode 10
        versionName "0.6.1"
    }
    signingConfigs {
        // A fixed debug key kept in the repo so every build can install over the last one.
        shared {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release { signingConfig signingConfigs.shared; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"/><title>3D</title><style>
@font-face{font-family:"Cairo";src:url("fonts/cairo-ar.woff2") format("woff2");font-weight:200 1000;font-display:block;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFC,U+200C-200E;}
@font-face{font-family:"Cairo";src:url("fonts/cairo-latin.woff2") format("woff2");font-weight:200 1000;font-display:block;}
html,body{margin:0;background:#050507}#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#050507;font-family:"Cairo",sans-serif;direction:rtl}
.clip{position:absolute;inset:0;overflow:hidden}.stage{position:absolute;left:0;right:0;top:640px;height:700px;perspective:1500px}
.bar{position:absolute;left:540px;top:350px;transform-style:preserve-3d}.f{position:absolute;left:0;top:0;backface-visibility:hidden;box-shadow:inset 0 0 40px rgba(120,80,0,.5)}
.f b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:84px;color:#8f6208;letter-spacing:6px}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,#3a2c0c,#050507 65%)}
.sh{position:absolute;left:240px;right:240px;top:1180px;height:90px;border-radius:50%;background:radial-gradient(#000,transparent 70%)}
.sp{position:absolute;width:26px;height:26px;background:#fff6c4;transform:rotate(45deg);opacity:0}
.t{position:absolute;top:240px;left:0;right:0;text-align:center;font-size:120px;font-weight:900;color:#ffd24a}</style><script src="gsap.min.js"></script></head><body>
<div id="root" data-composition-id="3d" data-start="0" data-duration="5" data-width="1080" data-height="1920"><div id="main" class="clip" data-start="0" data-duration="5" data-track-index="1"><div class="bg"></div><div class="t" id="t">ذهب</div><div class="sh"></div><div class="stage"><div class="bar" id="bar"><div class="f a" style="width:560px;height:200px;margin:-100.0px 0 0 -280.0px;transform:translateZ(150px);background:linear-gradient(135deg,#fff0a8,#e6b422 45%,#a8770a)"><b>999.9</b></div><div class="f b" style="width:560px;height:200px;margin:-100.0px 0 0 -280.0px;transform:rotateY(180deg) translateZ(150px);background:#8f6208"></div><div class="f c" style="width:300px;height:200px;margin:-100.0px 0 0 -150.0px;transform:rotateY(-90deg) translateZ(280px);background:linear-gradient(90deg,#c4920f,#8f6208)"></div><div class="f d" style="width:300px;height:200px;margin:-100.0px 0 0 -150.0px;transform:rotateY(90deg) translateZ(280px);background:linear-gradient(90deg,#8f6208,#d9a91c)"></div><div class="f e" style="width:560px;height:300px;margin:-150.0px 0 0 -280.0px;transform:rotateX(90deg) translateZ(100px);background:linear-gradient(135deg,#fff7c4,#f0c12a)"></div><div class="f g" style="width:560px;height:300px;margin:-150.0px 0 0 -280.0px;transform:rotateX(-90deg) translateZ(100px);background:#6b4a05"></div></div></div><i class="sp" style="left:200px;top:500px"></i><i class="sp" style="left:860px;top:640px"></i><i class="sp" style="left:300px;top:1300px"></i><i class="sp" style="left:800px;top:1360px"></i><i class="sp" style="left:540px;top:420px"></i><i class="sp" style="left:140px;top:980px"></i><i class="sp" style="left:930px;top:1000px"></i></div></div>
<script>const tl=gsap.timeline({paused:true});tl.fromTo("#bar",{rotateY:-40,rotateX:-26,y:-500,opacity:0},{y:0,opacity:1,duration:.9,ease:"bounce.out"},0);
tl.to("#bar",{rotateY:320,duration:4.1,ease:"power1.inOut"},.9);
tl.from("#t",{y:-60,opacity:0,duration:.5},.3);
document.querySelectorAll(".sp").forEach((s,i)=>{tl.fromTo(s,{opacity:0,scale:0},{opacity:1,scale:1.4,duration:.25,yoyo:true,repeat:1},1.2+i*.5)});
tl.to({},{duration:.01},4.99);window.__timelines=window.__timelines||{};window.__timelines["3d"]=tl;</script></body></html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مضيق هرمز</title>
<style>
@font-face { font-family: Cairo; src: url(fonts/Cairo.ttf); font-weight: 200 1000; }
html, body { margin: 0; background: #111; }
canvas { display: block; width: 540px; height: 960px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Deterministic renderer: render(t) draws the frame at time t (seconds). 6 scenes x 10s.
const W = 1080, H = 1920, SCENE = 10;
const C = {
  yellow: '#F2C94C', paper: '#F4EFE3', navy: '#1B2A4A', coral: '#E8604C',
  oil: '#F08A24', ink: '#141414', white: '#FFFFFF', sea: '#E9E1CF'
};
const LINES = [
  'خُمسُ نفطِ العالمِ كلَّ يوم، يمرُّ من ممرَّينِ عرضُ كلٍّ منهما ثلاثةُ كيلومتراتٍ فقط.',
  'هذا مضيقُ هُرمز. عشرونَ مليونَ برميلٍ يوميًّا، تعبرُ بين إيرانَ وعُمان.',
  'ومعظمُ هذه الناقلات تتّجه شرقًا، إلى الصينِ والهندِ واليابانِ وكوريا.',
  'وليسَ النفطُ وحده. خُمسُ تجارةِ الغازِ المُسالِ في العالمِ تعبرُ من هنا أيضًا.',
  'فلماذا لا نلتفُّ حوله؟ الأنابيبُ البديلة لا تنقلُ إلّا نحوَ ثُمنِ هذه الكمية.',
  'لذلك، حين يهتزُّ هذا الممرُّ الصغير، يرتفعُ سعرُ البنزينِ في محطّتِك أنت.'
];
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const ar = n => n.toLocaleString('ar-EG');
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// paper grain + halftone, built once
const grain = document.createElement('canvas'); grain.width = 540; grain.height = 960;
{ const g = grain.getContext('2d'); const id = g.createImageData(540, 960);
  for (let i = 0; i < id.data.length; i += 4) { const v = rnd() * 255; id.data[i] = id.data[i+1] = id.data[i+2] = v; id.data[i+3] = 255; }
  g.putImageData(id, 0, 0); }
const dots = document.createElement('canvas'); dots.width = 24; dots.height = 24;
{ const g = dots.getContext('2d'); g.fillStyle = 'rgba(0,0,0,0.07)'; g.beginPath(); g.arc(6, 6, 3.2, 0, 7); g.arc(18, 18, 3.2, 0, 7); g.fill(); }
let dotPat = null;

function bg(color) {
  ctx.fillStyle = color; ctx.fillRect(0, 0, W, H);
  dotPat = dotPat || ctx.createPattern(dots, 'repeat');
  ctx.fillStyle = dotPat; ctx.fillRect(0, 0, W, H);
}
function finish() {
  ctx.save(); ctx.globalAlpha = 0.07; ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(grain, 0, 0, W, H); ctx.restore();
  // vignette
  const g = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.22)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
// "cutout sticker": white paper border + drop shadow around any path
function sticker(path, fill, border = 16) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.28)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 10;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  path(); ctx.lineWidth = border * 2; ctx.strokeStyle = C.white; ctx.stroke();
  ctx.restore();
  ctx.save(); path(); ctx.fillStyle = fill; ctx.fill(); ctx.restore();
}
function text(s, x, y, size, color, weight = 900, align = 'center', alpha = 1) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.direction = 'rtl'; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.font = `${weight} ${size}px Cairo`; ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.restore();
}
// big title that pops in with overshoot, on a paper label
function label(s, x, y, size, p, fg = C.ink, bgc = C.white, rot = -0.03) {
  if (p <= 0) return;
  const k = back(clamp(p));
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(k, k);
  ctx.font = `900 ${size}px Cairo`; ctx.direction = 'rtl';
  const w = ctx.measureText(s).width + size * 0.7, h = size * 1.45;
  ctx.shadowColor = 'rgba(0,0,0,0.25)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 8;
  ctx.fillStyle = bgc; ctx.fillRect(-w/2, -h/2, w, h);
  ctx.shadowColor = 'transparent';
  // tape strip
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.save(); ctx.rotate(0.25); ctx.fillRect(-w/2 - 20, -h/2 - 18, 90, 32); ctx.restore();
  ctx.restore();
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(k, k);
  text(s, 0, size * 0.06, size, fg);
  ctx.restore();
}
// hand-drawn marker ellipse, drawn progressively
function marker(x, y, rx, ry, p, color = C.ink, w = 9) {
  if (p <= 0) return;
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath();
  const turns = 1.12, n = 90, m = Math.floor(n * clamp(p));
  for (let i = 0; i <= m; i++) {
    const a = -1.9 + (i / n) * Math.PI * 2 * turns;
    const wob = 1 + 0.035 * Math.sin(i * 0.37) + (i / n) * 0.06;
    const px = x + Math.cos(a) * rx * wob, py = y + Math.sin(a) * ry * wob;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke(); ctx.restore();
}
function underline(x1, x2, y, p, color = C.ink) {
  if (p <= 0) return;
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 10; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y); ctx.quadraticCurveTo((x1 + x2) / 2, y + 14, lerp(x1, x2, clamp(p)), y - 4); ctx.stroke(); ctx.restore();
}
function drop(x, y, s, color = C.oil) {
  sticker(() => { ctx.beginPath(); ctx.moveTo(x, y - 60 * s);
    ctx.bezierCurveTo(x + 18 * s, y - 25 * s, x + 42 * s, y, x + 42 * s, y + 22 * s);
    ctx.arc(x, y + 22 * s, 42 * s, 0, Math.PI);
    ctx.bezierCurveTo(x - 42 * s, y, x - 18 * s, y - 25 * s, x, y - 60 * s); ctx.closePath(); }, color, 8 * s);
}
function tanker(x, y, s, ang = 0, color = C.oil) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  sticker(() => { ctx.beginPath(); ctx.moveTo(-60*s, -14*s); ctx.lineTo(48*s, -14*s); ctx.lineTo(66*s, 0); ctx.lineTo(48*s, 14*s); ctx.lineTo(-60*s, 14*s); ctx.closePath(); }, color, 5 * s);
  ctx.fillStyle = C.navy; ctx.fillRect(-56*s, -10*s, 18*s, 20*s);
  ctx.restore();
}
function caption(k, t) {
  const a = prog(t, 0.15, 0.6) * (1 - prog(t, 9.7, 10));
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  ctx.font = '800 58px Cairo'; ctx.direction = 'rtl';
  const words = LINES[k].split(' '), lines = []; let cur = '';
  for (const w of words) { const test = cur ? cur + ' ' + w : w; if (ctx.measureText(test).width > 900 && cur) { lines.push(cur); cur = w; } else cur = test; }
  lines.push(cur);
  const lh = 86, boxH = lines.length * lh + 56, y0 = 1690 - boxH / 2;
  ctx.fillStyle = 'rgba(20,20,20,0.82)';
  roundRect(70, y0, W - 140, boxH, 26); ctx.fill();
  ctx.restore();
  lines.forEach((l, i) => text(l, W / 2, y0 + 28 + lh / 2 + i * lh, 58, C.white, 800, 'center', a));
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function polyPt(pts, u) { // point + angle along a polyline at fraction u
  const seg = []; let L = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]); seg.push(d); L += d; }
  let d = clamp(u) * L;
  for (let i = 0; i < seg.length; i++) { if (d <= seg[i] || i === seg.length - 1) { const f = seg[i] ? d / seg[i] : 0, a = pts[i], b = pts[i+1];
    return [lerp(a[0], b[0], f), lerp(a[1], b[1], f), Math.atan2(b[1]-a[1], b[0]-a[0])]; } d -= seg[i]; }
}
function dashed(pts, p, color, w = 8, dash = [22, 18], off = 0) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.setLineDash(dash); ctx.lineDashOffset = off;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  const steps = 60; for (let i = 1; i <= steps * clamp(p); i++) { const q = polyPt(pts, i / steps); ctx.lineTo(q[0], q[1]); }
  ctx.stroke(); ctx.restore();
}

// ---------- scenes ----------
function scene1(t) {
  bg(C.yellow);
  const cx = 540, cy = 820;
  const fade = 1 - prog(t, 4.4, 5.1);
  // the drop falls
  if (t < 1.1) { const y = lerp(-120, cy, eo(prog(t, 0, 1.0))); drop(cx, y, 1.6); }
  // the drop becomes the world's oil, split in five
  if (fade > 0) {
    const r = 330 * back(prog(t, 1.0, 1.6)) ;
    ctx.save(); ctx.globalAlpha = fade;
    for (let i = 0; i < 5; i++) {
      const a0 = -Math.PI / 2 + i * (Math.PI * 2 / 5), a1 = a0 + Math.PI * 2 / 5;
      const pull = i === 0 ? eo(prog(t, 2.8, 3.6)) * 120 : 0;
      const mid = (a0 + a1) / 2, ox = Math.cos(mid) * pull, oy = Math.sin(mid) * pull;
      const show = prog(t, 1.1 + i * 0.12, 1.4 + i * 0.12);
      if (show <= 0) continue;
      sticker(() => { ctx.beginPath(); ctx.moveTo(cx + ox, cy + oy); ctx.arc(cx + ox, cy + oy, r * show, a0 + 0.02, a1 - 0.02); ctx.closePath(); }, i === 0 ? C.oil : C.navy, 8);
    }
    ctx.restore();
    label('خُمس نفط العالم', 540, 340, 92, prog(t, 1.6, 2.1) * fade, C.ink);
    marker(cx + 150, cy - 210, 190, 170, prog(t, 3.4, 4.2) * fade, C.coral, 11);
  }
  // ...squeezes into two narrow lanes
  const q = prog(t, 4.8, 5.8);
  if (q > 0) {
    const gap = 70, lw = lerp(380, 120, eo(prog(t, 5.2, 6.6)));
    ctx.save(); ctx.globalAlpha = q;
    // land walls
    sticker(() => { ctx.beginPath(); ctx.rect(-40, 470, 540 - gap/2 - lw + 40, 760); }, C.navy, 10);
    sticker(() => { ctx.beginPath(); ctx.rect(540 + gap/2 + lw, 470, 540, 760); }, C.coral, 10);
    // buffer
    ctx.fillStyle = C.paper; ctx.fillRect(540 - gap/2, 470, gap, 760);
    // flowing oil in each lane
    for (const s of [-1, 1]) {
      const x0 = s < 0 ? 540 - gap/2 - lw : 540 + gap/2;
      ctx.fillStyle = 'rgba(240,138,36,0.35)'; ctx.fillRect(x0, 470, lw, 760);
      for (let i = 0; i < 9; i++) {
        const yy = 470 + ((i * 95 + (s < 0 ? 1 : -1) * t * 260) % 760 + 760) % 760;
        drop(x0 + lw / 2, yy, 0.42);
      }
    }
    ctx.restore();
    label('ممرّان', 540, 340, 92, prog(t, 5.6, 6.1), C.ink);
    label('عرض كلٍّ منهما ٣ كم فقط', 540, 1330, 66, prog(t, 6.6, 7.1), C.white, C.ink, 0.02);
    marker(540, 850, 290, 410, prog(t, 7.6, 8.6), C.ink, 10);
  }
  caption(0, t);
}

const IRAN = [[-20,330],[1100,330],[1100,780],[900,820],[730,760],[610,790],[470,720],[260,690],[-20,650]];
const OMAN = [[-20,1480],[1100,1480],[1100,1150],[900,1060],[740,1000],[660,900],[615,850],[575,905],[430,1000],[220,1020],[-20,990]];
const ROUTE = [[-40,860],[300,850],[520,800],[620,815],[760,880],[1120,990]];
function land(pts, fill) { sticker(() => { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); }, fill, 12); }
function scene2(t) {
  bg(C.sea);
  const z = lerp(1, 1.12, eo(prog(t, 0, 10)));
  ctx.save(); ctx.translate(600, 840); ctx.scale(z, z); ctx.translate(-600, -840);
  ctx.save(); ctx.translate(0, -400 * (1 - eo(prog(t, 0.1, 0.9)))); land(IRAN, C.navy); ctx.restore();
  ctx.save(); ctx.translate(0, 400 * (1 - eo(prog(t, 0.2, 1.0)))); land(OMAN, C.coral); ctx.restore();
  dashed(ROUTE, prog(t, 1.0, 2.2), C.ink, 6, [18, 16], -t * 40);
  for (let i = 0; i < 7; i++) {
    const u = ((t - 1.6) * 0.075 + i / 7) % 1;
    if (t < 1.6 + i * 0.25) continue;
    const p = polyPt(ROUTE, u); tanker(p[0], p[1], 0.62, p[2]);
  }
  text('إيران', 780, 560, 84, C.white, 900, 'center', prog(t, 1.0, 1.4));
  text('عُمان', 870, 1250, 84, C.white, 900, 'center', prog(t, 1.2, 1.6));
  ctx.restore();
  label('مضيق هُرمز', 540, 240, 96, prog(t, 0.6, 1.1), C.ink);
  // the counter
  const n = Math.round(20000000 * eo(prog(t, 3.0, 6.0)) / 10000) * 10000;
  if (t > 2.8) {
    const a = prog(t, 2.8, 3.2);
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = C.white; ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 8;
    ctx.fillRect(90, 1090, 600, 250); ctx.restore();
    text(ar(n), 390, 1180, 112, C.oil, 900, 'center', a);
    text('برميل يوميًّا', 390, 1285, 58, C.ink, 800, 'center', a);
    underline(620, 160, 1320, prog(t, 6.0, 6.8), C.coral);
  }
  marker(612, 810, 120, 90, prog(t, 7.2, 8.2), C.ink, 10);
  caption(1, t);
}

const ORIGIN = [170, 1250];
const DEST = [['الهند', 430, 980, 0.0], ['الصين', 700, 640, 0.35], ['كوريا', 880, 470, 0.7], ['اليابان', 960, 760, 1.05]];
function curvePt(a, b, u) { const mx = (a[0] + b[0]) / 2 - 120, my = Math.min(a[1], b[1]) - 60 + 120;
  const x = (1-u)*(1-u)*a[0] + 2*(1-u)*u*mx + u*u*b[0], y = (1-u)*(1-u)*a[1] + 2*(1-u)*u*my + u*u*b[1]; return [x, y]; }
function scene3(t) {
  bg(C.navy);
  // faint grid
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 2;
  for (let x = 0; x < W; x += 90) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 90) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
  label('معظمها يتّجه شرقًا', 540, 240, 90, prog(t, 0.5, 1.0), C.ink, C.yellow);
  // origin
  const pulse = 1 + 0.25 * Math.sin(t * 5);
  ctx.save(); ctx.fillStyle = 'rgba(240,138,36,0.25)'; ctx.beginPath(); ctx.arc(ORIGIN[0], ORIGIN[1], 60 * pulse, 0, 7); ctx.fill(); ctx.restore();
  sticker(() => { ctx.beginPath(); ctx.arc(ORIGIN[0], ORIGIN[1], 30, 0, 7); }, C.oil, 8);
  text('هُرمز', ORIGIN[0], ORIGIN[1] + 90, 56, C.white, 800, 'center', prog(t, 0.6, 1.0));
  for (const [name, x, y, d] of DEST) {
    const p = eo(prog(t, 1.6 + d, 3.2 + d));
    if (p <= 0) continue;
    ctx.save(); ctx.strokeStyle = C.oil; ctx.lineWidth = 7; ctx.setLineDash([20, 14]); ctx.lineDashOffset = -t * 50; ctx.beginPath();
    for (let i = 0; i <= 40 * p; i++) { const q = curvePt(ORIGIN, [x, y], i / 40); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }
    ctx.stroke(); ctx.restore();
    // a tanker riding each route
    const u = ((t - 1.6 - d) * 0.18) % 1;
    if (p >= 1 || u < p) { const a = curvePt(ORIGIN, [x, y], u), b = curvePt(ORIGIN, [x, y], Math.min(1, u + 0.01)); tanker(a[0], a[1], 0.5, Math.atan2(b[1]-a[1], b[0]-a[0])); }
    if (p >= 0.98) {
      const s = back(prog(t, 3.2 + d, 3.6 + d));
      ctx.save(); ctx.fillStyle = 'rgba(232,96,76,0.3)'; ctx.beginPath(); ctx.arc(x, y, 46 * pulse * s, 0, 7); ctx.fill(); ctx.restore();
      sticker(() => { ctx.beginPath(); ctx.arc(x, y, 22 * s, 0, 7); }, C.coral, 7);
      label(name, x, y - 80, 58, prog(t, 3.3 + d, 3.7 + d), C.ink, C.white, 0.02);
    }
  }
  marker(820, 650, 260, 300, prog(t, 7.0, 8.0), C.yellow, 10);
  caption(2, t);
}

function barrel(x, y, s) {
  sticker(() => { roundRect(x - 110*s, y - 150*s, 220*s, 300*s, 30*s); }, C.oil, 12);
  ctx.save(); ctx.fillStyle = 'rgba(0,0,0,0.18)';
  for (const k of [-0.45, 0.45]) ctx.fillRect(x - 110*s, y + k * 300*s - 8*s, 220*s, 16*s);
  ctx.restore();
}
function sphere(x, y, s) {
  sticker(() => { ctx.beginPath(); ctx.rect(x - 95*s, y + 60*s, 22*s, 150*s); ctx.rect(x + 73*s, y + 60*s, 22*s, 150*s); ctx.rect(x - 14*s, y + 90*s, 28*s, 120*s); }, C.navy, 6);
  sticker(() => { ctx.beginPath(); ctx.arc(x, y, 140*s, 0, 7); }, '#D9E4EE', 12);
  ctx.save(); ctx.fillStyle = 'rgba(27,42,74,0.25)'; ctx.fillRect(x - 140*s, y - 8*s, 280*s, 16*s);
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(x - 50*s, y - 60*s, 30*s, 0, 7); ctx.fill(); ctx.restore();
}
function scene4(t) {
  bg(C.paper);
  const slide = eo(prog(t, 1.6, 2.4));
  const bs = back(prog(t, 0.3, 0.9));
  if (bs > 0) barrel(lerp(540, 300, slide), 640, bs);
  label('ليس النفط وحده', 540, 240, 90, prog(t, 0.8, 1.3), C.white, C.navy);
  const ss = back(prog(t, 2.2, 2.9));
  if (ss > 0) sphere(780, 610, ss);
  text('نفط', lerp(540, 300, slide), 870, 60, C.ink, 900, 'center', prog(t, 0.9, 1.2));
  text('غاز مُسال', 780, 870, 60, C.ink, 900, 'center', prog(t, 2.8, 3.2));
  // pie: one fifth of world LNG trade
  const px = 540, py = 1180, r = 200, pp = prog(t, 3.6, 4.4);
  if (pp > 0) {
    sticker(() => { ctx.beginPath(); ctx.arc(px, py, r * back(pp), 0, 7); }, C.navy, 10);
    const sw = eo(prog(t, 4.6, 5.6)) * Math.PI * 2 / 5;
    if (sw > 0) { ctx.save(); ctx.fillStyle = C.coral; ctx.beginPath(); ctx.moveTo(px, py); ctx.arc(px, py, r - 4, -Math.PI/2, -Math.PI/2 + sw); ctx.closePath(); ctx.fill(); ctx.restore(); }
    label('٪٢٠ من تجارة الغاز المُسال', 540, 1440, 60, prog(t, 5.6, 6.1), C.white, C.coral, -0.02);
    marker(px + 110, py - 90, 130, 120, prog(t, 6.6, 7.4), C.ink, 10);
  }
  caption(3, t);
}

function scene5(t) {
  bg(C.coral);
  label('لماذا لا نلتفّ حوله؟', 540, 240, 86, prog(t, 0.4, 0.9), C.ink, C.white);
  const base = 1360, h1 = 900 * eo(prog(t, 1.6, 3.2)), h2 = 900 * 0.13 * eo(prog(t, 3.4, 4.4));
  // big flow: Hormuz
  if (h1 > 0) {
    sticker(() => { ctx.beginPath(); ctx.rect(200, base - h1, 260, h1); }, C.navy, 12);
    for (let i = 0; i < Math.floor(h1 / 110); i++) drop(330, base - 60 - i * 110, 0.45);
  }
  if (h2 > 0) sticker(() => { ctx.beginPath(); ctx.rect(620, base - h2, 260, h2); }, C.oil, 12);
  ctx.save(); ctx.fillStyle = C.ink; ctx.fillRect(140, base, 800, 10); ctx.restore();
  text('عبر المضيق', 330, base + 60, 50, C.white, 800, 'center', prog(t, 1.6, 2.0));
  text('~٢٠ مليون', 330, base - h1 - 50, 54, C.white, 900, 'center', prog(t, 3.0, 3.3));
  text('الأنابيب البديلة', 750, base + 60, 50, C.white, 800, 'center', prog(t, 3.4, 3.8));
  text('~٢٫٦ مليون', 750, base - h2 - 50, 54, C.white, 900, 'center', prog(t, 4.2, 4.5));
  marker(750, base - h2 / 2 + 8, 175, 95, prog(t, 5.2, 6.2), C.ink, 11);
  label('≈ الثُّمن فقط', 750, 860, 76, prog(t, 6.2, 6.7), C.white, C.ink, 0.04);
  caption(4, t);
}

function pump(x, y, t) {
  sticker(() => { roundRect(x - 190, y - 300, 380, 600, 28); }, C.navy, 14);
  // screen
  ctx.save(); ctx.fillStyle = '#0E1626'; roundRect(x - 140, y - 250, 280, 200, 16); ctx.fill(); ctx.restore();
  // rising line inside the screen
  const p = eo(prog(t, 2.2, 5.0));
  ctx.save(); ctx.strokeStyle = C.oil; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath();
  const pts = [[-110, 30], [-60, 20], [-20, 25], [20, -10], [60, -40], [110, -100]];
  for (let i = 0; i < pts.length; i++) { const u = i / (pts.length - 1); if (u > p) break; const X = x + pts[i][0], Y = y - 150 + pts[i][1] + 40; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }
  ctx.stroke(); ctx.restore();
  if (p > 0.95) { ctx.save(); ctx.fillStyle = C.oil; ctx.beginPath(); const X = x + 110, Y = y - 150 - 60; ctx.moveTo(X, Y - 26); ctx.lineTo(X + 22, Y + 6); ctx.lineTo(X - 22, Y + 6); ctx.closePath(); ctx.fill(); ctx.restore(); }
  // nozzle + hose
  ctx.save(); ctx.strokeStyle = C.ink; ctx.lineWidth = 22; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x + 190, y - 40); ctx.bezierCurveTo(x + 330, y + 20, x + 300, y + 260, x + 250, y + 300); ctx.stroke(); ctx.restore();
  sticker(() => { roundRect(x + 200, y - 120, 90, 120, 14); }, C.coral, 8);
  sticker(() => { roundRect(x - 120, y + 20, 240, 200, 14); }, C.oil, 6);
}
function scene6(t) {
  bg(C.yellow);
  const enter = eo(prog(t, 0.1, 0.8));
  ctx.save(); ctx.translate(0, (1 - enter) * 700);
  pump(470, 880, t);
  ctx.restore();
  if (t < 2.2) { const y = lerp(-120, 900, eo(prog(t, 0.9, 2.0))); if (t > 0.9) drop(470, y, 1.2); }
  label('يرتفع السعر', 540, 240, 96, prog(t, 4.2, 4.7), C.white, C.coral);
  label('في محطّتك أنت', 540, 1360, 80, prog(t, 6.0, 6.5), C.white, C.ink, 0.03);
  marker(470, 880, 300, 420, prog(t, 6.6, 7.6), C.coral, 11);
  // end card
  const e = prog(t, 8.4, 9.0);
  if (e > 0) {
    ctx.save(); ctx.globalAlpha = e; ctx.fillStyle = C.navy; ctx.fillRect(0, 0, W, H); ctx.restore();
    label('مضيق هُرمز', 540, 820, 120, prog(t, 8.6, 9.1), C.ink, C.yellow);
    text('ممرٌّ صغير… يحرّك العالم', 540, 1000, 64, C.white, 800, 'center', prog(t, 8.9, 9.3));
  }
  if (t < 8.6) caption(5, t);
}

const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6];
// color-block wipe hides every cut (in motion → cut → in motion)
function wipe(k, t) {
  const cols = [C.navy, C.coral, C.yellow, C.navy, C.yellow, C.navy];
  if (k < 5 && t > 9.65) { const p = eo(prog(t, 9.65, 10)); ctx.fillStyle = cols[k]; ctx.fillRect(0, H * (1 - p), W, H * p); }
  if (k > 0 && t < 0.35) { const p = eo(prog(t, 0, 0.35)); ctx.fillStyle = cols[k - 1]; ctx.fillRect(0, 0, W, H * (1 - p)); }
}
window.render = function (T) {
  const k = Math.min(5, Math.floor(T / SCENE)), t = T - k * SCENE;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.shadowColor = 'transparent';
  SCENES[k](t); finish(); wipe(k, t);
};
window.ready = document.fonts.load('900 60px Cairo').then(() => document.fonts.load('800 60px Cairo')).then(() => { render(0); return true; });
</script>
